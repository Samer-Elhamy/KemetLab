# Tier routing via Google Gemini (CPA-GUI Proxy / AI Studio)
# Ollama completely disabled by user directive
gateway: gemini

tiers:
  heavy: gemini-3.8-flash-high
  light: gemini-3.8-flash-lite

routing:
  propose: heavy
  peer_review: heavy
  json_repair: light
  block_summary: light
  shard_synthesis: light
  research_chat: heavy

difficulty:
  heavy_threshold: 0.55
  light_threshold: 0.35
  force_heavy_states:
    - propose
    - research_chat
    - peer_review
  force_light_states:
    - json_repair
    - block_summary
    - shard_synthesis
  heavy_keywords:
    - hypothesis
    - champion
    - dead_end
    - refactor
    - graph
    - proposal
